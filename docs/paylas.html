<!DOCTYPE html><html lang="tr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>GALAXSI · Günün X Postu</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#050807">
<style>
*{box-sizing:border-box;margin:0}
body{background:#050807;color:#c9e8d4;font:16px/1.6 system-ui,Segoe UI,Roboto,sans-serif;padding:20px 15px 60px}
.w{max-width:560px;margin:0 auto}
h1{font-size:22px;color:#eafff2;margin-bottom:4px}
.sub{color:#5f8a70;font-size:13px;margin-bottom:18px}
.post{background:#0a100d;border:1px solid #1e5c37;border-radius:12px;padding:18px 18px;white-space:pre-wrap;font-size:15.5px;line-height:1.65;color:#eafff2;min-height:120px}
.meta{display:flex;justify-content:space-between;align-items:center;margin:10px 2px 16px;font-size:12px;color:#5f8a70}
.badge{background:#123822;color:#39ff88;padding:3px 9px;border-radius:20px;font-weight:600}
.btn{display:block;width:100%;text-align:center;text-decoration:none;border:0;border-radius:10px;padding:15px;font-size:16px;font-weight:700;cursor:pointer;margin:9px 0}
.x{background:#000;color:#fff;border:1px solid #333}
.copy{background:#0a100d;color:#39ff88;border:1px solid #1e5c37}
.done{background:#39ff88;color:#04140b}
.steps{background:#0a100d;border:1px solid #123822;border-radius:10px;padding:14px 16px;margin-top:18px;font-size:13.5px;color:#9fc7ac;line-height:1.7}
.steps b{color:#39ff88}
.mut{color:#5f8a70}
.rf{font-size:12px;color:#5f8a70;background:none;border:1px solid #123822;border-radius:6px;padding:5px 10px;cursor:pointer}
</style></head><body>
<div class="w">
  <div style="display:flex;justify-content:space-between;align-items:center">
    <div><h1>📢 Günün X Postu</h1></div>
    <button class="rf" onclick="load()">↻ Yenile</button>
  </div>
  <div class="sub">Sistem hazırladı — sen tek tık paylaş. Her gün yeni post.</div>

  <div id="post" class="post">Yükleniyor…</div>
  <div class="meta"><span id="cnt"></span><span id="badge"></span></div>

  <a id="xbtn" class="btn x" href="#" target="_blank" rel="noopener">𝕏  X'te Paylaş</a>
  <button id="cbtn" class="btn copy" onclick="copyText()">📋  Metni Kopyala</button>

  <div class="steps">
    <b>Nasıl paylaşılır?</b><br>
    1. <b>"𝕏 X'te Paylaş"</b> butonuna bas → X açılır, yazı <b>hazır dolu</b> gelir<br>
    2. X'te sadece <b>"Gönder / Post"</b> butonuna bas → bitti ✅<br>
    <span class="mut">(İlk sefer X'e giriş isteyebilir — bir kez giriş yap.)</span>
  </div>
</div>

<script>
var TXT='';
function load(){
  fetch('/data/x_post.json?_='+Date.now(),{cache:'no-store'})
    .then(function(r){return r.json()})
    .then(function(d){
      TXT=(d&&d.text)||'';
      document.getElementById('post').textContent=TXT||'Bugünün postu birazdan hazır olur (motor 30 dk’da bir üretir). Birazdan yenile.';
      document.getElementById('cnt').textContent=TXT?(TXT.length+' karakter'):'';
      document.getElementById('badge').innerHTML=TXT?'<span class="badge">✓ hazır</span>':'';
      var kindTr=d&&d.kind==='delist'?'delist bayrağı':'rehber + korku endeksi';
      if(TXT){document.getElementById('badge').innerHTML='<span class="badge">✓ '+kindTr+'</span>';}
      document.getElementById('xbtn').href='https://twitter.com/intent/tweet?text='+encodeURIComponent(TXT);
    })
    .catch(function(){
      document.getElementById('post').textContent='Post henüz yüklenemedi — birazdan yenile.';
    });
}
function copyText(){
  if(!TXT)return;
  navigator.clipboard.writeText(TXT).then(function(){
    var b=document.getElementById('cbtn');b.textContent='✓ Kopyalandı!';b.className='btn done';
    setTimeout(function(){b.textContent='📋  Metni Kopyala';b.className='btn copy';},1800);
  });
}
load();
</script>
</body></html>
